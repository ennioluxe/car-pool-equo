<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>A CHI TOCCA?</title>

<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="manifest" href="manifest.json">

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f6f9;
    margin:20px;
}

h1{
    text-align:center;
    color:#003366;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.boxDash{
    background:white;
    border-radius:12px;
    padding:10px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.titoloDash{
    font-size:12px;
    color:#666;
}

.valoreDash{
    font-size:22px;
    font-weight:bold;
}

.collega{
    border:3px solid #ccc;
    border-radius:12px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.assente{
    background:white;
}

.presente{
    background:#28a745;
    color:white;
}

.autista{
    background:#dc3545;
    color:white;
}

.suggerito{
    border-color:red !important;
    box-shadow:0 0 0 3px rgba(255,0,0,.25);
}

.nome{
    font-size:22px;
    font-weight:bold;
}

.punti{
    margin-top:10px;
    font-size:15px;
    line-height:1.5;
}

.guideBox{
    color:#d62828;
    font-size:20px;
}

.presente .guideBox,
.autista .guideBox{
    color:white;
}

#suggerimento{
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:#b00020;
    margin-top:15px;
    min-height:24px;
}

#bannerModifica{
    display:none;
    background:#fff3cd;
    border:1px solid #f59e0b;
    border-radius:8px;
    padding:10px;
    margin-bottom:12px;
    text-align:center;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0078d4;
    color:white;
    cursor:pointer;
}

button:disabled{
    background:#999;
    cursor:not-allowed;
}

#salva{
    width:100%;
    margin-top:15px;
    font-size:18px;
}

#annullaModifica{
    display:none;
    width:100%;
    margin-top:10px;
    background:#6c757d;
}

input:disabled{
    background:#e9ecef;
    color:#495057;
    border:1px solid #ced4da;
    cursor:not-allowed;
    opacity:1;
}

details summary{
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.rigaStorico{
    border-bottom:1px solid #ddd;
    padding:8px 0;
}

.collegaAdmin{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px;
    border-bottom:1px solid #ddd;
}

.btnModifica{
    background:#f59e0b;
    margin-right:10px;
}

.btnElimina{
    background:#dc3545;
}

</style>

</head>

<body>

<h1>🚗 A CHI TOCCA?</h1>

<div class="dashboard">

    <div class="boxDash">
        <div class="titoloDash">Giornate</div>
        <div id="dashGiornate" class="valoreDash">-</div>
    </div>

    <div class="boxDash">
        <div class="titoloDash">Ultimo autista</div>
        <div id="dashUltimo" class="valoreDash">-</div>
    </div>

</div>

<div class="card">

    <div id="bannerModifica"></div>

    <p>
        Data:
        <input type="date" id="data">
    </p>

    <div id="griglia" class="grid">
        Caricamento...
    </div>

    <div id="suggerimento"></div>

    <button id="salva" disabled>✅ Salva Giornata</button>

    <button id="annullaModifica">✖ Annulla modifica</button>

</div>

<details class="card">

    <summary>📜 Storico e giornate passate</summary>

    <br>

    <h3>Storico registrato</h3>

    <button id="scaricaStorico">📥 Scarica storico (.xls)</button>

    <br><br>

    <div id="storico">Caricamento storico...</div>

</details>

<div class="card" id="areaAdmin" style="display:none;">

    <h3>👥 Gestione Colleghi</h3>

    <p>
        Nuovo collega:
        <input type="text" id="nuovoCollega" placeholder="Nome collega">
        <button id="btnAggiungiCollega">➕ Aggiungi</button>
    </p>

    <div id="listaColleghiAdmin">Caricamento...</div>

</div>

<p style="text-align:center; margin-top:30px; margin-bottom:10px;">

    <button id="btnLogin">👑 Accesso Admin</button>

    <button id="btnLogout">🚪 Esci</button>

</p>


<script>

/* ============================================================
   CONFIGURAZIONE
   ============================================================ */

const API =
"https://script.google.com/macros/s/AKfycbzNGjL8JcSFFSoipvd0_4-C_GdsknLapRpCypOSsBCMRWqaKswG4VVIrzBcU4sKQ8Sh-A/exec";

const PASSWORD_ADMIN = "CarPool2026";

/* ============================================================
   STATO DELL'APP
   ============================================================ */

let isAdmin = localStorage.getItem("carpool_admin") === "true";

let statistiche      = {};   // { nome: {presenze, guide, ultimaGuida} }
let colleghiLista    = [];   // [nome, nome, ...]
let storicoCache     = [];   // turni ordinati per data
let stato            = {};   // { nome: 0 assente | 1 presente | 2 autista }
let modificaCorrente = null; // id del turno in modifica (null = nuovo turno)
let occupato         = false;

const $ = id => document.getElementById(id);

/* ============================================================
   FUNZIONI DI UTILITA'
   ============================================================ */

function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
}

function formatData(iso){
    const p = String(iso).split("-");
    if(p.length !== 3) return iso;
    return p[2] + "/" + p[1] + "/" + p[0];
}

function oggi(){
    const d = new Date();
    return d.getFullYear() + "-" +
           String(d.getMonth() + 1).padStart(2,"0") + "-" +
           String(d.getDate()).padStart(2,"0");
}

async function post(payload){
    const res = await fetch(API, {
        method: "POST",
        body: JSON.stringify(payload)
    });
    try{
        return await res.json();
    }catch(e){
        return { success:true };
    }
}

/* ============================================================
   CARICAMENTO DATI (una sola chiamata: bootstrap)
   ============================================================ */

async function avvia(){

    try{

        const r = await fetch(API + "?action=bootstrap").then(x => x.json());

        statistiche   = r.statistiche || {};
        colleghiLista = (r.colleghi || []).map(c => c.nome);
        storicoCache  = (r.storico || [])
            .slice()
            .sort((a,b) => String(a.data).localeCompare(String(b.data)));

        $("dashGiornate").innerText = storicoCache.length;
        $("dashUltimo").innerText =
            storicoCache.length
            ? storicoCache[storicoCache.length - 1].autista
            : "-";

        creaGriglia();
        mostraStorico();
        caricaColleghiAdmin();
        verificaAdmin();
        aggiornaInterfacciaModifica();

    }catch(err){

        console.error(err);

        $("griglia").innerHTML =
            "Errore di caricamento. Ricarica la pagina.";

        $("storico").innerHTML = "Errore caricamento storico";
    }
}

/* ============================================================
   GRIGLIA COLLEGHI
   ============================================================ */

function creaGriglia(){

    stato = {};

    const totaleViaggi = storicoCache.length;

    let html = "";

    Object.keys(statistiche).forEach(nome => {

        stato[nome] = 0;

        const presenze = statistiche[nome].presenze || 0;
        const guide    = statistiche[nome].guide || 0;

        const percPresenze =
            totaleViaggi > 0
            ? (presenze * 100 / totaleViaggi).toFixed(1)
            : "0.0";

        const percGuide =
            presenze > 0
            ? (guide * 100 / presenze).toFixed(1)
            : "0.0";

        html += `
        <div class="collega assente" data-nome="${esc(nome)}">

            <div class="nome">${esc(nome)}</div>

            <div class="punti">

                👥 Presenze: ${presenze} (${percPresenze}%)

                <br><br>

                🚗 Guide:
                <strong class="guideBox">
                    ${guide} (${percGuide}%)
                </strong>

            </div>

        </div>
        `;
    });

    if(html === ""){
        html = "Nessun collega presente. Aggiungili dall'area admin.";
    }

    $("griglia").innerHTML = html;

    document.querySelectorAll("#griglia .collega").forEach(el => {
        el.addEventListener("click", () => clic(el.dataset.nome));
    });

    $("suggerimento").innerText = "";
    $("salva").disabled = true;
}

function clic(nome){

    const attuale = stato[nome];

    if(attuale === 0){

        stato[nome] = 1;

    }else if(attuale === 1){

        // un solo autista alla volta
        Object.keys(stato).forEach(n => {
            if(stato[n] === 2) stato[n] = 1;
        });

        stato[nome] = 2;

    }else{

        stato[nome] = 0;
    }

    aggiorna();
}

function aggiorna(){

    let autistaScelto = false;

    document.querySelectorAll("#griglia .collega").forEach(el => {

        const s = stato[el.dataset.nome];

        el.className = "collega";

        if(s === 0) el.classList.add("assente");
        if(s === 1) el.classList.add("presente");
        if(s === 2){
            el.classList.add("autista");
            autistaScelto = true;
        }
    });

    suggerisci();

    $("salva").disabled = !autistaScelto || occupato;
}

/* ============================================================
   LOGICA DI SUGGERIMENTO
   Suggerisce, tra i presenti di oggi, chi ha la percentuale
   piu' bassa di guide rispetto alle PROPRIE presenze.
   A parita' di percentuale: chi ha guidato meno di recente.
   Chi non ha ancora presenze conta come 0%.
   ============================================================ */

function suggerisci(){

    const candidati = [];

    Object.keys(stato).forEach(nome => {

        if(stato[nome] > 0){

            const presenze = statistiche[nome].presenze || 0;
            const guide    = statistiche[nome].guide || 0;

            candidati.push({
                nome: nome,
                percentuale: presenze > 0 ? guide / presenze : 0,
                ultima: statistiche[nome].ultimaGuida || ""
            });
        }
    });

    document.querySelectorAll("#griglia .collega").forEach(el => {
        el.classList.remove("suggerito");
    });

    if(candidati.length === 0){
        $("suggerimento").innerText = "";
        return;
    }

    candidati.sort((a,b) => {

        if(Math.abs(a.percentuale - b.percentuale) > 1e-9){
            return a.percentuale - b.percentuale;
        }

        return a.ultima.localeCompare(b.ultima);
    });

    const migliore = candidati[0];

    document.querySelectorAll("#griglia .collega").forEach(el => {
        if(el.dataset.nome === migliore.nome){
            el.classList.add("suggerito");
        }
    });

    $("suggerimento").innerText = "👉 Tocca a: " + migliore.nome;
}

/* ============================================================
   SALVATAGGIO / MODIFICA GIORNATA
   ============================================================ */

async function salvaGiornata(){

    if(occupato) return;

    const presenti = [];
    let autista = null;

    Object.keys(stato).forEach(nome => {
        if(stato[nome] > 0) presenti.push(nome);
        if(stato[nome] === 2) autista = nome;
    });

    if(!autista){
        alert("Seleziona un conducente");
        return;
    }

    const data = $("data").value;

    if(!data){
        alert("Seleziona una data");
        return;
    }

    const esisteGia = storicoCache.some(x =>
        x.data === data && x.id !== modificaCorrente
    );

    if(esisteGia){
        alert("⚠️ Esiste già una giornata registrata per questa data.");
        return;
    }

    occupato = true;
    $("salva").disabled = true;

    try{

        const payload = modificaCorrente
            ? { tipo:"modificaTurno", id:modificaCorrente,
                data:data, presenti:presenti, autista:autista }
            : { tipo:"salvaTurno",
                data:data, presenti:presenti, autista:autista };

        const res = await post(payload);

        if(res && res.success === false){
            alert("Errore: " + (res.errore || "salvataggio non riuscito"));
        }else{
            alert(modificaCorrente ? "Modifiche salvate" : "Giornata salvata");
            modificaCorrente = null;
            $("data").value = oggi();
        }

        await avvia();

    }catch(err){

        console.error(err);
        alert("Errore durante il salvataggio");

    }finally{

        occupato = false;
        aggiorna();
    }
}

function modificaTurno(id){

    const turno = storicoCache.find(x => x.id === id);

    if(!turno) return;

    modificaCorrente = id;

    $("data").value = turno.data;

    creaGriglia();

    (turno.presenti || []).forEach(nome => {
        if(nome in stato) stato[nome] = 1;
    });

    if(turno.autista in stato){
        stato[turno.autista] = 2;
    }

    aggiorna();
    aggiornaInterfacciaModifica();

    window.scrollTo({ top:0, behavior:"smooth" });
}

function annullaModifica(){

    modificaCorrente = null;

    $("data").value = oggi();

    creaGriglia();
    aggiornaInterfacciaModifica();
}

function aggiornaInterfacciaModifica(){

    const inModifica = modificaCorrente !== null;

    $("salva").innerText =
        inModifica ? "💾 Salva modifiche" : "✅ Salva Giornata";

    $("annullaModifica").style.display =
        inModifica ? "block" : "none";

    const banner = $("bannerModifica");

    if(inModifica){
        const turno = storicoCache.find(x => x.id === modificaCorrente);
        banner.style.display = "block";
        banner.innerText =
            "✏️ Stai modificando la giornata del " +
            formatData(turno ? turno.data : $("data").value);
    }else{
        banner.style.display = "none";
    }
}

async function eliminaTurno(id){

    if(!confirm("Eliminare questa giornata?")) return;

    try{

        const res = await post({ tipo:"eliminaTurno", id:id });

        if(res && res.success === false){
            alert("Errore: " + (res.errore || "eliminazione non riuscita"));
        }else{
            alert("Giornata eliminata");
        }

        if(modificaCorrente === id) modificaCorrente = null;

        await avvia();

    }catch(err){

        console.error(err);
        alert("Errore eliminazione");
    }
}

/* ============================================================
   STORICO
   ============================================================ */

function mostraStorico(){

    let html = "";

    storicoCache.slice().reverse().forEach(r => {

        html += `
        <div class="rigaStorico">

            <b>${formatData(r.data)}</b>

            <br>

            Presenti: ${esc((r.presenti || []).join(", "))}

            <br>

            Autista: ${esc(r.autista)}

            <br><br>

            ${
                isAdmin
                ? `
                <button class="btnModifica"
                        data-azione="modifica"
                        data-id="${esc(r.id)}">
                    ✏️ Modifica
                </button>

                <button class="btnElimina"
                        data-azione="elimina"
                        data-id="${esc(r.id)}">
                    🗑 Elimina
                </button>
                `
                : ""
            }

        </div>
        `;
    });

    if(html === ""){
        html = "Nessuna giornata registrata";
    }

    $("storico").innerHTML = html;
}

$("storico").addEventListener("click", e => {

    const btn = e.target.closest("button[data-azione]");

    if(!btn) return;

    if(btn.dataset.azione === "modifica") modificaTurno(btn.dataset.id);
    if(btn.dataset.azione === "elimina")  eliminaTurno(btn.dataset.id);
});

function scaricaStorico(){

    const righe = [["Data", "Presenti", "Autista"]];

    storicoCache.forEach(r => {
        righe.push([
            formatData(r.data),
            (r.presenti || []).join(", "),
            r.autista
        ]);
    });

    let html = `
    <html>
    <head><meta charset="UTF-8"></head>
    <body>
    <table border="1">
    `;

    righe.forEach(riga => {
        html += "<tr>";
        riga.forEach(cella => {
            html += "<td>" + esc(cella) + "</td>";
        });
        html += "</tr>";
    });

    html += `
    </table>
    </body>
    </html>
    `;

    const blob = new Blob([html], { type:"application/vnd.ms-excel" });

    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "storico_car_pool.xls";
    link.click();
}

/* ============================================================
   GESTIONE COLLEGHI (ADMIN)
   ============================================================ */

function caricaColleghiAdmin(){

    if(!isAdmin) return;

    let html = "";

    colleghiLista.forEach(nome => {

        html += `
        <div class="collegaAdmin">

            <span>${esc(nome)}</span>

            <button class="btnElimina"
                    data-nome="${esc(nome)}">
                🗑
            </button>

        </div>
        `;
    });

    if(html === "") html = "Nessun collega";

    $("listaColleghiAdmin").innerHTML = html;
}

$("listaColleghiAdmin").addEventListener("click", e => {

    const btn = e.target.closest("button[data-nome]");

    if(btn) eliminaCollega(btn.dataset.nome);
});

async function aggiungiCollega(){

    const nome = $("nuovoCollega").value.trim();

    if(!nome){
        alert("Inserire un nome");
        return;
    }

    try{

        const res = await post({ tipo:"aggiungiCollega", nome:nome });

        if(res && res.success === false){
            alert("Errore: " + (res.errore || "aggiunta non riuscita"));
            return;
        }

        $("nuovoCollega").value = "";

        await avvia();

        alert("Collega aggiunto");

    }catch(err){

        console.error(err);
        alert("Errore durante l'aggiunta");
    }
}

async function eliminaCollega(nome){

    if(!confirm("Eliminare " + nome + " ?")) return;

    try{

        await post({ tipo:"eliminaCollega", nome:nome });

        await avvia();

        alert("Collega eliminato");

    }catch(err){

        console.error(err);
        alert("Errore durante l'eliminazione");
    }
}

/* ============================================================
   ADMIN: LOGIN / LOGOUT
   ============================================================ */

function verificaAdmin(){

    $("areaAdmin").style.display = isAdmin ? "block" : "none";

    $("data").disabled = !isAdmin;
}

function loginAdmin(){

    const pwd = prompt("Password amministratore");

    if(pwd === null) return;

    if(pwd === PASSWORD_ADMIN){

        localStorage.setItem("carpool_admin", "true");

        alert("Modalità amministratore attivata");

        location.reload();

    }else{

        alert("Password errata");
    }
}

function logoutAdmin(){

    localStorage.removeItem("carpool_admin");

    location.reload();
}

/* ============================================================
   COLLEGAMENTO EVENTI E AVVIO
   ============================================================ */

$("salva").addEventListener("click", salvaGiornata);
$("annullaModifica").addEventListener("click", annullaModifica);
$("btnAggiungiCollega").addEventListener("click", aggiungiCollega);
$("scaricaStorico").addEventListener("click", scaricaStorico);
$("btnLogin").addEventListener("click", loginAdmin);
$("btnLogout").addEventListener("click", logoutAdmin);

$("data").value = oggi();

verificaAdmin();

avvia();

</script>

</body>
</html>
