<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>A CHI TOCCA?</title>

<link rel="icon" type="image/png" href="favicon.png">

<link rel="apple-touch-icon" href="favicon.png">

<link rel="manifest" href="manifest.json">

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f6f9;
    margin:20px;
}

h1{
    text-align:center;
    color:#003366;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

    .dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}

.boxDash{
    background:white;
    border-radius:12px;
    padding:10px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.titoloDash{
    font-size:12px;
    color:#666;
}

.valoreDash{
    font-size:22px;
    font-weight:bold;
}

.collega{
    border:3px solid #ccc;
    border-radius:12px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.assente{
    background:white;
}

.presente{
    background:#28a745;
    color:white;
}

.autista{
    background:#dc3545;
    color:white;
}

.suggerito{
    border-color:red !important;
}

.nome{
    font-size:22px;
    font-weight:bold;
}

.punti{
    margin-top:10px;
    font-size:15px;
    line-height:1.5;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0078d4;
    color:white;
    cursor:pointer;
}

#salva{
    width:100%;
    margin-top:20px;
    font-size:18px;
}

#salva:disabled{
    background:#999;
}

    input:disabled{
    background:#e9ecef;
    color:#495057;
    border:1px solid #ced4da;
    cursor:not-allowed;
    opacity:1;
}
    
    details summary{
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.rigaStorico{
    border-bottom:1px solid #ddd;
    padding:8px 0;
}

    #grigliaStorico{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

    .collegaAdmin{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:8px;

    border-bottom:1px solid #ddd;

}

</style>

</head>

<body>

<h1>🚗 A CHI TOCCA?</h1>


    <div class="dashboard">

    <div class="boxDash">
        <div class="titoloDash">
            Giornate
        </div>
        <div id="dashGiornate"
             class="valoreDash">
            -
        </div>
    </div>

    <div class="boxDash">
        <div class="titoloDash">
            Ultimo autista
        </div>
        <div id="dashUltimo"
             class="valoreDash">
            -
        </div>
    </div>

</div>

<div class="card">

    <p>
    Data:
    <input type="date" id="data">
    </p>

    <div id="griglia" class="grid">
    </div>

    <button
        id="salva"
        disabled>
        ✅ Salva Giornata
    </button>

</div>

<details class="card">

    <summary>
        📜 Storico e giornate passate
    </summary>

    <br>


<h3>Storico registrato</h3>

<button id="scaricaStorico">
    📥 Scarica storico (.xlsx)
</button>

<br><br>

<div id="storico">
    Caricamento storico...
</div>

</details>

    <div
    class="card"
    id="areaAdmin"
    style="display:none;">

    <h3>👥 Gestione Colleghi</h3>

    <p>

        Nuovo collega:

        <input
            type="text"
            id="nuovoCollega"
            placeholder="Nome collega">

        <button
            id="btnAggiungiCollega">

            ➕ Aggiungi

        </button>

    </p>

    <div id="listaColleghiAdmin">

        Caricamento...

    </div>

</div>

<p
style="
text-align:center;
margin-top:30px;
margin-bottom:10px;">

<button onclick="loginAdmin()">

👑 Accesso Admin

</button>

<button onclick="logoutAdmin()">

🚪 Esci

</button>

</p>

    
<script>

const API =
"https://script.google.com/macros/s/AKfycbxP2QpM_PjTQfXsBfmgoYZ1W2Ye-hYkUhMD1zAHhbntUdbbo2KsaobMYO_zG-sjHH32-Q/exec";

const PASSWORD_ADMIN = "CarPool2026";

let isAdmin =
localStorage.getItem(
    "carpool_admin"
) === "true";

let statistiche = {};
let stato = {};
let modificaCorrente = null;

let totaleGiornate = 0;

document.getElementById("data").value =
new Date().toISOString().split("T")[0];

function verificaAdmin(){

    const campoData =
    document.getElementById("data");

    if(isAdmin){

        mostraFunzioniAdmin();

        campoData.disabled = false;

    }else{

        campoData.disabled = true;

    }

}

async function avvia(){

    statistiche =
    await fetch(
        API + "?action=statistiche"
    ).then(r=>r.json());

    await aggiornaDashboard();

    creaGriglia();

    caricaStorico();

    caricaColleghiAdmin();

    verificaAdmin();

}

function creaGriglia(){

    stato = {};

    let html = "";

   const totaleViaggi =
totaleGiornate;


    Object.keys(statistiche)
    .forEach(nome=>{

        stato[nome] = 0;

        const presenze =
        statistiche[nome].presenze || 0;

        const guide =
        statistiche[nome].guide || 0;

        const percPresenze =
        totaleViaggi > 0
        ?
        (
            presenze * 100 /
            totaleViaggi
        ).toFixed(1)
        :
        0;

        const percGuide =
        presenze > 0
        ?
        (
            guide * 100 /
            presenze
        ).toFixed(1)
        :
        0;

        html += `
        <div
            class="collega assente"
            id="c_${nome}"
            onclick="clic('${nome}')">

            <div class="nome">
                ${nome}
            </div>

           <div class="punti">

    👥 Presenze:
    ${presenze}
    (${percPresenze}%)

    <br><br>

    🚗 Guide:
    <strong
    style="
    color:#d62828;
    font-size:20px;
    ">

    ${guide}
    (${percGuide}%)

    </strong>

</div>

        </div>
        `;

    });

    document
    .getElementById("griglia")
    .innerHTML = html;

}


function clic(nome){

    let attuale = stato[nome];

    if(attuale === 0){

        stato[nome] = 1;

    }

    else if(attuale === 1){

        Object.keys(stato)
        .forEach(n=>{

            if(stato[n]===2){

                stato[n]=1;

            }

        });

        stato[nome] = 2;

    }

    else{

        stato[nome] = 0;

    }

    aggiorna();

}

function aggiorna(){

    let autistaRosso = false;

    Object.keys(stato)
    .forEach(nome=>{

        let el =
        document.getElementById(
            "c_" + nome
        );

        el.className =
        "collega";

        if(stato[nome] == 0){

            el.classList.add(
                "assente"
            );

        }

        if(stato[nome] == 1){

            el.classList.add(
                "presente"
            );

        }

        if(stato[nome] == 2){

            el.classList.add(
                "autista"
            );

            autistaRosso = true;
        }

    });

    suggerisci();

    document
    .getElementById("salva")
    .disabled =
    !autistaRosso;
}

function suggerisci(){

    let candidati = [];

    Object.keys(stato)
    .forEach(nome=>{

        if(stato[nome] > 0){

            const presenze =
            statistiche[nome].presenze || 0;

            const guide =
            statistiche[nome].guide || 0;

            if(presenze === 0){
                return;
            }

            candidati.push({

                nome:nome,

                percentuale:
                guide / presenze,

                ultima:
                statistiche[nome]
                .ultimaGuida || ""

            });

        }

    });

    document
    .querySelectorAll(".collega")
    .forEach(x =>
        x.classList.remove(
            "suggerito"
        )
    );

    if(candidati.length === 0){
        return;
    }

    candidati.sort((a,b)=>{

        if(
            a.percentuale !==
            b.percentuale
        ){

            return (
                a.percentuale -
                b.percentuale
            );

        }

        return a.ultima.localeCompare(
            b.ultima
        );

    });

    const migliore =
    candidati[0];

    document
    .getElementById(
        "c_" + migliore.nome
    )
    .classList.add(
        "suggerito"
    );

}
document
.getElementById("salva")
.addEventListener(
"click",
salvaGiornata
);
    
    document
.getElementById(
    "btnAggiungiCollega"
)

    document
.getElementById("scaricaStorico")
.addEventListener(
    "click",
    scaricaStorico
);
        
.addEventListener(
    "click",
    aggiungiCollega
);

async function salvaGiornata(){

    let presenti = [];

    let autista = null;

    Object.keys(stato)
    .forEach(nome=>{

        if(stato[nome] > 0){

            presenti.push(nome);

        }

        if(stato[nome] === 2){

            autista = nome;

        }

    });

    if(!autista){

        alert(
        "Seleziona un conducente"
        );

        return;
    }

    const storico =
    await fetch(
        API + "?action=storico"
    ).then(r=>r.json());

const dataSelezionata =
document
.getElementById("data")
.value;

    console.log(storico);

const esisteGia =
storico.some(x => {

    const dataStorico =
    new Date(x.data)
    .toLocaleDateString(
        "sv-SE"
    );

    console.log(
    dataStorico,
    dataSelezionata
    );
    
    return (
        dataStorico ===
        dataSelezionata
    );

});

if(esisteGia){

    alert(
        "⚠️ Esiste già una giornata registrata per questa data."
    );

    return;
}
    
    try{

        await fetch(
            API,
            {
                method:"POST",

                body:JSON.stringify({

                    tipo:"salvaTurno",

                    data:
                    document
                    .getElementById("data")
                    .value,

                    presenti:

                    presenti,

                    autista:

                    autista

                })

            }
        );

alert(
"Giornata salvata"
);

statistiche =
await fetch(
    API + "?action=statistiche"
).then(r=>r.json());

stato = {};

await aggiornaDashboard();

creaGriglia();

caricaStorico();


document
.getElementById("salva")
.disabled = true;

}

catch(err){

    alert(
    "Errore durante il salvataggio"
    );

    console.error(err);

}

}

    async function caricaStorico(){

    try{

        const storico =
        await fetch(
            API + "?action=storico"
        ).then(r=>r.json());

        let html = "";

        storico
        .slice()
        .reverse()
        .forEach(r=>{

            const dataOriginale =
            new Date(r.data);
            
            const dataFormattata =
            dataOriginale.toLocaleDateString(
                "it-IT"
            );

            html += `

          <div class="rigaStorico">

   <b>${dataFormattata}</b>

    <br>

    Presenti:
    ${r.presenti.join(", ")}

    <br>

    Autista:
    ${r.autista}

    <br><br>

${

isAdmin

?

`

<button
onclick="modificaTurno(${r.id})"
style="background:#f59e0b;margin-right:10px;">

✏️ Modifica

</button>

<button
onclick="eliminaTurno(${r.id})"
style="background:#dc3545;">

🗑 Elimina

</button>

`

:

""

}

</div>

`;

        });

        if(html===""){

            html =
            "Nessuna giornata registrata";

        }

        document
        .getElementById("storico")
        .innerHTML = html;

    }

    catch(err){

        document
        .getElementById("storico")
        .innerHTML =
        "Errore caricamento storico";

    }

}
    
async function eliminaTurno(id){

    const conferma =
    confirm(

      "Eliminare questa giornata?"

    );

    if(!conferma){

        return;

    }

    try{

        await fetch(
            API,
            {
                method:"POST",

                body:JSON.stringify({

                    tipo:"eliminaTurno",

                    id:id

                })

            }
        );

        alert(
        "Giornata eliminata"
        );

        statistiche =
        await fetch(
            API + "?action=statistiche"
        ).then(r=>r.json());

        await aggiornaDashboard();

        creaGriglia();

        caricaStorico();

    }

    catch(err){

        alert(
        "Errore eliminazione"
        );

        console.error(err);

    }

}

    async function modificaTurno(id){

    const storico =
    await fetch(
        API + "?action=storico"
    ).then(r=>r.json());

    const turno =
    storico.find(
        x => x.id == id
    );

    if(!turno){
        return;
    }

    modificaCorrente = id;

    document
    .querySelector("details")
    .open = true;

   const dataOriginale =
new Date(turno.data);

const yyyy =
dataOriginale.getUTCFullYear();

const mm =
String(
    dataOriginale.getUTCMonth() + 1
).padStart(2,"0");

const dd =
String(
    dataOriginale.getUTCDate()
).padStart(2,"0");

document
.getElementById(
    "dataStorico"
).value =
`${yyyy}-${mm}-${dd}`;

    preparaStorico();

    setTimeout(()=>{

        turno.presenti
        .forEach(nome=>{

            statoStorico[nome] = 1;

        });

        statoStorico[
            turno.autista
        ] = 2;

        aggiornaStorico();

        const btn =
        document.querySelector(
            "#grigliaStorico button"
        );

        if(btn){

            btn.innerText =
            "💾 Salva modifiche";

        }

    },100);

}

async function caricaColleghiAdmin(){

    const colleghi =
    await fetch(
        API + "?action=colleghi"
    ).then(r=>r.json());

    let html = "";

    colleghi.forEach(c=>{

        html += `

        <div class="collegaAdmin">

            <span>

                ${c.nome}

            </span>

            <button

                onclick="eliminaCollega('${c.nome}')"

                style="background:#dc3545;">

                🗑

            </button>

        </div>

        `;

    });

    document
    .getElementById(
        "listaColleghiAdmin"
    )
    .innerHTML = html;

}

async function aggiungiCollega(){

    const nome =
    document
    .getElementById(
        "nuovoCollega"
    )
    .value
    .trim();

    if(!nome){

        alert(
        "Inserire un nome"
        );

        return;
    }

    await fetch(
        API,
        {
            method:"POST",

            body:JSON.stringify({

                tipo:
                "aggiungiCollega",

                nome:
                nome

            })

        }
    );

    document
    .getElementById(
        "nuovoCollega"
    ).value = "";

    await caricaColleghiAdmin();

    statistiche =
    await fetch(
        API + "?action=statistiche"
    ).then(r=>r.json());

    await aggiornaDashboard();

    creaGriglia();
    
    alert(
    "Collega aggiunto"
    );

}

async function eliminaCollega(nome){

    const conferma =
    confirm(

    "Eliminare " +
    nome +
    " ?"

    );

    if(!conferma){

        return;

    }

    await fetch(
        API,
        {
            method:"POST",

            body:JSON.stringify({

                tipo:
                "eliminaCollega",

                nome:
                nome

            })

        }
    );

   await caricaColleghiAdmin();

    statistiche =
    await fetch(
        API + "?action=statistiche"
    ).then(r=>r.json());

    await aggiornaDashboard();

    creaGriglia();
    
    alert(
    "Collega eliminato"
    );

}

function mostraFunzioniAdmin(){

    document
    .getElementById(
        "areaAdmin"
    )
    .style.display =
    "block";

}

function loginAdmin(){

    const pwd =
    prompt(
        "Password amministratore"
    );

    if(
        pwd ===
        PASSWORD_ADMIN
    ){

        localStorage.setItem(
            "carpool_admin",
            "true"
        );

        isAdmin = true;

        mostraFunzioniAdmin();

        alert(
            "Modalità amministratore attivata"
        );

        location.reload();

    }

    else{

        alert(
            "Password errata"
        );

    }

}

function logoutAdmin(){

    localStorage.removeItem(
        "carpool_admin"
    );

    location.reload();

}

async function aggiornaDashboard(){

    const storico =
    await fetch(
        API + "?action=storico"
    ).then(r=>r.json());

totaleGiornate =
storico.length;

document
.getElementById(
    "dashGiornate"
).innerText =
totaleGiornate;

    if(storico.length){

        document
        .getElementById(
            "dashUltimo"
        ).innerText =
        storico[
            storico.length - 1
        ].autista;

    }else{

        document
        .getElementById(
            "dashUltimo"
        ).innerText =
        "-";

    }

}

async function scaricaStorico(){

    const storico =
    await fetch(
        API + "?action=storico"
    ).then(r=>r.json());

    let contenuto = [];

    contenuto.push([
        "Data",
        "Presenti",
        "Autista"
    ]);

    storico.forEach(r=>{

        const data =
        new Date(r.data)
        .toLocaleDateString(
            "it-IT"
        );

        contenuto.push([
            data,
            r.presenti.join(", "),
            r.autista
        ]);

    });

    let html = `
    <html>
    <head>
    <meta charset="UTF-8">
    </head>
    <body>
    <table border="1">
    `;

    contenuto.forEach(riga=>{

        html += "<tr>";

        riga.forEach(cella=>{

            html +=
            "<td>" +
            cella +
            "</td>";

        });

        html += "</tr>";

    });

    html += `
    </table>
    </body>
    </html>
    `;

    const blob =
    new Blob(
        [html],
        {
            type:
            "application/vnd.ms-excel"
        }
    );

    const link =
    document.createElement(
        "a"
    );

    link.href =
    URL.createObjectURL(
        blob
    );

    link.download =
    "storico_car_pool.xls";

    link.click();

}
    
avvia();

</script>

</body>
</html>
