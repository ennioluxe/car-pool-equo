<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A CHI TOCCA?</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="manifest" href="manifest.json">

<style>
body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f6f9;
    margin:20px;
}
h1{
    text-align:center;
    color:#003366;
}
.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:15px;
}
.boxDash{
    background:white;
    border-radius:12px;
    padding:10px;
    text-align:center;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.titoloDash{
    font-size:12px;
    color:#666;
}
.valoreDash{
    font-size:22px;
    font-weight:bold;
}
.collega{
    border:3px solid #ccc;
    border-radius:12px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}
.assente{ background:white; }
.presente{ background:#28a745; color:white; }
.autista{ background:#dc3545; color:white; }
.suggerito{ border-color:red !important; }
.nome{ font-size:22px; font-weight:bold; }
.punti{ margin-top:10px; font-size:15px; line-height:1.5; }
button{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0078d4;
    color:white;
    cursor:pointer;
}
#salva{ width:100%; margin-top:20px; font-size:18px; }
#salva:disabled{ background:#999; }
input:disabled{
    background:#e9ecef;
    color:#495057;
    border:1px solid #ced4da;
    cursor:not-allowed;
    opacity:1;
}
details summary{ cursor:pointer; font-size:18px; font-weight:bold; }
.rigaStorico{ border-bottom:1px solid #ddd; padding:8px 0; }
#grigliaStorico{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
.collegaAdmin{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px;
    border-bottom:1px solid #ddd;
}
.sezioneModifica {
    background: #fef3c7;
    border: 2px dashed #f59e0b;
    padding: 15px;
    margin-top: 10px;
    margin-bottom: 20px;
    border-radius: 8px;
}
</style>
</head>

<body>

<h1>🚗 A CHI TOCCA?</h1>

<div class="dashboard">
    <div class="boxDash">
        <div class="titoloDash">Giornate</div>
        <div id="dashGiornate" class="valoreDash">-</div>
    </div>
    <div class="boxDash">
        <div class="titoloDash">Ultimo autista</div>
        <div id="dashUltimo" class="valoreDash">-</div>
    </div>
</div>

<div class="card">
    <p>Data: <input type="date" id="data"></p>
    <div id="griglia" class="grid"></div>
    <button id="salva" disabled>✅ Salva Giornata</button>
</div>

<details class="card">
    <summary>📜 Storico e giornate passate</summary>
    <br>
    <h3>Storico registrato</h3>
    <button id="scaricaStorico">📥 Scarica storico (.xls)</button>
    <br><br>
    
    <!-- Pannello Modifica Dinamico Interpato Correttamente -->
    <div id="areaModificaContenitore" class="sezioneModifica" style="display:none;">
        <h4 style="margin-top:0;">✏️ Modifica Turno Selezionato</h4>
        <p>Data Storico: <input type="date" id="dataStorico"></p>
        <div id="grigliaStorico"></div>
        <br>
        <button id="btnSalvaModifica" style="background:#f59e0b; width:100%;">💾 Salva modifiche</button>
        <button type="button" onclick="annullaModifica()" style="background:#6b7280; width:100%; margin-top:5px;">Annulla</button>
    </div>

    <div id="storico">Caricamento storico...</div>
</details>

<div class="card" id="areaAdmin" style="display:none;">
    <h3>👥 Gestione Colleghi</h3>
    <p>
        Nuovo collega:
        <input type="text" id="nuovoCollega" placeholder="Nome collega">
        <button id="btnAggiungiCollega">➕ Aggiungi</button>
    </p>
    <div id="listaColleghiAdmin">Caricamento...</div>
</div>

<p style="text-align:center; margin-top:30px; margin-bottom:10px;">
    <button onclick="loginAdmin()">👑 Accesso Admin</button>
    <button onclick="logoutAdmin()">🚪 Esci</button>
</p>

<script>
const API = "https://script.google.com/macros/s/AKfycbwKI_apMrhjAWfWXWzioK7qBuMSgSFx93LCqkO9qiksluAZUFZ9cPb3jVMbN1U-B3oZBQ/exec";
const PASSWORD_ADMIN = "CarPool2026";

let isAdmin = localStorage.getItem("carpool_admin") === "true";
let statistiche = {};
let stato = {};
let statoStorico = {};
let modificaCorrente = null;
let totaleGiornate = 0;

// Corretta l'assegnazione iniziale per impostare la stringa data pulita nel campo data
document.getElementById("data").value = new Date().toISOString().split("T")[0];

function verificaAdmin(){
    const campoData = document.getElementById("data");
    if(isAdmin){
        mostraFunzioniAdmin();
        campoData.disabled = false;
    }else{
        campoData.disabled = true;
    }
}

async function avvia(){
    try {
        statistiche = await fetch(API + "?action=statistiche").then(r=>r.json());
        await aggiornaDashboard();
        creaGriglia();
        await caricaStorico();
        if(isAdmin){ await caricaColleghiAdmin(); }
        verificaAdmin();
    } catch(e) {
        console.error("Errore inizializzazione:", e);
    }
}

function creaGriglia(){
    stato = {};
    let html = "";
    const totaleViaggi = totaleGiornate;

    Object.keys(statistiche).forEach(nome=>{
        stato[nome] = 0;
        const presenze = statistiche[nome].presenze || 0;
        const guide = statistiche[nome].guide || 0;
        const percPresenze = totaleViaggi > 0 ? (presenze * 100 / totaleViaggi).toFixed(1) : 0;
        const percGuide = presenze > 0 ? (guide * 100 / presenze).toFixed(1) : 0;

        html += `
        <div class="collega assente" id="c_${nome}" onclick="clic('${nome}')">
            <div class="nome">${nome}</div>
            <div class="punti">
                👥 Presenze: ${presenze} (${percPresenze}%)<br><br>
                🚗 Guide: <strong style="color:#d62828; font-size:20px;">${guide} (${percGuide}%)</strong>
            </div>
        </div>
        `;
    });
    document.getElementById("griglia").innerHTML = html;
}

function clic(nome){
    let attuale = stato[nome];
    if(attuale === 0){ stato[nome] = 1; }
    else if(attuale === 1){
        Object.keys(stato).forEach(n=>{ if(stato[n]===2){ stato[n]=1; } });
        stato[nome] = 2;
    }else{ stato[nome] = 0; }
    aggiorna();
}

function aggiorna(){
    let autistaRosso = false;
    Object.keys(stato).forEach(nome=>{
        let el = document.getElementById("c_" + nome);
        if(!el) return;
        el.className = "collega";
        if(stato[nome] == 0){ el.classList.add("assente"); }
        if(stato[nome] == 1){ el.classList.add("presente"); }
        if(stato[nome] == 2){ el.classList.add("autista"); autistaRosso = true; }
    });
    suggerisci();
    document.getElementById("salva").disabled = !autistaRosso;
}

function suggerisci(){
    let candidati = [];
    Object.keys(stato).forEach(nome=>{
        if(stato[nome] > 0){
            const presenze = statistiche[nome].presenze || 0;
            const guide = statistiche[nome].guide || 0;
            if(presenze === 0){ return; }
            
            candidati.push({
                nome: nome,
                percentuale: guide / presenze, // Calcolo basato sulle presenze effettive
                ultima: statistiche[nome].ultimaGuida || ""
            });
        }
    });

    document.querySelectorAll(".collega").forEach(x => x.classList.remove("suggerito"));
    if(candidati.length === 0){ return; }

    // Algoritmo meritocratico di ordinamento
    candidati.sort((a,b)=>{
        if(a.percentuale !== b.percentuale){ return a.percentuale - b.percentuale; }
        return a.ultima.localeCompare(b.ultima); // In caso di parità, chi ha guidato più tempo fa
    });

    const migliore = candidati[0];
    const elSuggerito = document.getElementById("c_" + migliore.nome);
    if(elSuggerito) elSuggerito.classList.add("suggerito");
}

document.getElementById("salva").addEventListener("click", salvaGiornata);
document.getElementById("btnAggiungiCollega").addEventListener("click", aggiungiCollega);
document.getElementById("scaricaStorico").addEventListener("click", scaricaStorico);
document.getElementById("btnSalvaModifica").addEventListener("click", salvaModificaTurno);

async function salvaGiornata(){
    let presenti = [];
    let autista = null;
    Object.keys(stato).forEach(nome=>{
        if(stato[nome] > 0){ presenti.push(nome); }
        if(stato[nome] === 2){ autista = nome; }
    });

    if(!autista){ alert("Seleziona un conducente"); return; }

    const storico = await fetch(API + "?action=storico").then(r=>r.json());
    const dataSelezionata = document.getElementById("data").value;

    const esisteGia = storico.some(x => {
        const dataStorico = new Date(x.data).toLocaleDateString("sv-SE");
        return (dataStorico === dataSelezionata);
    });

    if(esisteGia){ alert("⚠️ Esiste già una giornata registrata per questa data."); return; }
    
    try{
        await fetch(API, {
            method:"POST",
            body:JSON.stringify({
                tipo:"salvaTurno",
                data: dataSelezionata,
                presenti: presenti,
                autista: autista
            })
        });

        alert("Giornata salvata");
        statistiche = await fetch(API + "?action=statistiche").then(r=>r.json());
        stato = {};
        await aggiornaDashboard();
        creaGriglia();
        caricaStorico();
        document.getElementById("salva").disabled = true;
    }catch(err){
        alert("Errore durante il salvataggio");
        console.error(err);
    }
}

async function caricaStorico(){
    try{
        const storico = await fetch(API + "?action=storico").then(r=>r.json());
