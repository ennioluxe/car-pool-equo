<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Car Pool Equo</title>

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f6f9;
    margin:20px;
}

h1{
    text-align:center;
    color:#003366;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.collega{
    border:3px solid #ccc;
    border-radius:12px;
    padding:15px;
    text-align:center;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.assente{
    background:white;
}

.presente{
    background:#28a745;
    color:white;
}

.autista{
    background:#dc3545;
    color:white;
}

.suggerito{
    border-color:red !important;
}

.nome{
    font-size:22px;
    font-weight:bold;
}

.punti{
    margin-top:8px;
    font-size:18px;
}

#autistaSuggerito{
    text-align:center;
    margin-bottom:20px;
}

#nomeAutista{
    color:red;
    font-size:34px;
    font-weight:bold;
}

button{
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0078d4;
    color:white;
    cursor:pointer;
}

#salva{
    width:100%;
    margin-top:20px;
    font-size:18px;
}

#salva:disabled{
    background:#999;
}
    details summary{
    cursor:pointer;
    font-size:18px;
    font-weight:bold;
}

.rigaStorico{
    border-bottom:1px solid #ddd;
    padding:8px 0;
}

    #grigliaStorico{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

</style>

</head>

<body>

<h1>🚗 Car Pool Equo</h1>

<div class="card">

    <p>
    Data:
    <input type="date" id="data">
    </p>

    <div id="autistaSuggerito">

        <div>
        Autista suggerito
        </div>

        <div id="nomeAutista">
        -
        </div>

    </div>

    <div id="griglia" class="grid">
    </div>

    <button
        id="salva"
        disabled>
        ✅ Salva Giornata
    </button>

</div>

<details class="card">

    <summary>
        📜 Storico e giornate passate
    </summary>

    <br>

    <h3>➕ Inserisci giornata passata</h3>

<p>
Data:
<input type="date" id="dataStorico">
</p>

<button id="preparaStorico">
    Carica colleghi
</button>

<br><br>

<div id="grigliaStorico"></div>

<hr>

<h3>Storico registrato</h3>

<div id="storico">
    Caricamento storico...
</div>

</details>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxP2QpM_PjTQfXsBfmgoYZ1W2Ye-hYkUhMD1zAHhbntUdbbo2KsaobMYO_zG-sjHH32-Q/exec";

let statistiche = {};
let stato = {};
let statoStorico = {};

document.getElementById("data").value =
new Date().toISOString().split("T")[0];

async function avvia(){

    statistiche =
    await fetch(
        API + "?action=statistiche"
    ).then(r=>r.json());

    creaGriglia();

    caricaStorico();

}

function creaGriglia(){

    stato = {};

    let html = "";

    Object.keys(statistiche)
    .forEach(nome=>{

        stato[nome] = 0;

        html += `
        <div
            class="collega assente"
            id="c_${nome}"
            onclick="clic('${nome}')">

            <div class="nome">
                ${nome}
            </div>

            <div class="punti">
                (${statistiche[nome].punteggio})
            </div>

        </div>
        `;

    });

    document
    .getElementById("griglia")
    .innerHTML = html;

    }

function clic(nome){

    let attuale = stato[nome];

    if(attuale === 0){

        stato[nome] = 1;

    }

    else if(attuale === 1){

        Object.keys(stato)
        .forEach(n=>{

            if(stato[n]===2){

                stato[n]=1;

            }

        });

        stato[nome] = 2;

    }

    else{

        stato[nome] = 0;

    }

    aggiorna();

}

function aggiorna(){

    let autistaRosso = false;

    Object.keys(stato)
    .forEach(nome=>{

        let el =
        document.getElementById(
            "c_" + nome
        );

        el.className =
        "collega";

        if(stato[nome] == 0){

            el.classList.add(
                "assente"
            );

        }

        if(stato[nome] == 1){

            el.classList.add(
                "presente"
            );

        }

        if(stato[nome] == 2){

            el.classList.add(
                "autista"
            );

            autistaRosso = true;
        }

    });

    suggerisci();

    document
    .getElementById("salva")
    .disabled =
    !autistaRosso;
}

function suggerisci(){

    let candidati = [];

    Object.keys(stato)
    .forEach(nome=>{

        if(stato[nome] > 0){

            candidati.push({

                nome:nome,

                punti:
                statistiche[nome]
                .punteggio,

                ultima:
                statistiche[nome]
                .ultimaGuida || ""

            });

        }

    });

    document
    .querySelectorAll(".collega")
    .forEach(x =>
        x.classList.remove(
            "suggerito"
        )
    );

    if(candidati.length === 0){

        document
        .getElementById(
            "nomeAutista"
        )
        .innerText = "-";

        return;
    }

    candidati.sort((a,b)=>{

        if(
            b.punti !== a.punti
        ){
            return b.punti - a.punti;
        }

        return a.ultima.localeCompare(
            b.ultima
        );

    });

    let migliore =
    candidati[0];

    document
    .getElementById(
        "nomeAutista"
    )
    .innerHTML =

    migliore.nome +

    "<br>(" +

    migliore.punti +

    ")";

    document
    .getElementById(
        "c_" + migliore.nome
    )
    .classList.add(
        "suggerito"
    );

}
document
.getElementById("salva")
.addEventListener(
"click",
salvaGiornata
);
    
document
.getElementById("preparaStorico")
.addEventListener(
"click",
preparaStorico
);

async function salvaGiornata(){

    let presenti = [];

    let autista = null;

    Object.keys(stato)
    .forEach(nome=>{

        if(stato[nome] > 0){

            presenti.push(nome);

        }

        if(stato[nome] === 2){

            autista = nome;

        }

    });

    if(!autista){

        alert(
        "Seleziona un conducente"
        );

        return;
    }

    try{

        await fetch(
            API,
            {
                method:"POST",

                body:JSON.stringify({

                    tipo:"salvaTurno",

                    data:
                    document
                    .getElementById("data")
                    .value,

                    presenti:

                    presenti,

                    autista:

                    autista

                })

            }
        );

alert(
"Giornata salvata"
);

statistiche =
await fetch(
    API + "?action=statistiche"
).then(r=>r.json());

stato = {};

creaGriglia();

caricaStorico();

document
.getElementById("nomeAutista")
.innerText = "-";

document
.getElementById("salva")
.disabled = true;

}

catch(err){

    alert(
    "Errore durante il salvataggio"
    );

    console.error(err);

}

}

    async function caricaStorico(){

    try{

        const storico =
        await fetch(
            API + "?action=storico"
        ).then(r=>r.json());

        let html = "";

        storico
        .slice()
        .reverse()
        .forEach(r=>{

            html += `

            <div class="rigaStorico">

                <b>${r.data}</b>

                <br>

                Presenti:
                ${r.presenti.join(", ")}

                <br>

                Autista:
                ${r.autista}

            </div>

            `;

        });

        if(html===""){

            html =
            "Nessuna giornata registrata";

        }

        document
        .getElementById("storico")
        .innerHTML = html;

    }

    catch(err){

        document
        .getElementById("storico")
        .innerHTML =
        "Errore caricamento storico";

    }

}

function preparaStorico(){

    statoStorico = {};

    let html = "";

    Object.keys(statistiche)
    .forEach(nome=>{

        statoStorico[nome] = 0;

        html += `
        <div
            class="collega assente"
            id="s_${nome}"
            onclick="clicStorico('${nome}')">

            <div class="nome">
                ${nome}
            </div>

            <div class="punti">
                (${statistiche[nome].punteggio})
            </div>

        </div>
        `;

    });

    html += `
    <button
        onclick="salvaGiornataPassata()"
        style="grid-column:1 / span 2;">
        ✅ Salva giornata passata
    </button>
    `;

    document
    .getElementById("grigliaStorico")
    .innerHTML = html;
}

function clicStorico(nome){

    let attuale = statoStorico[nome];

    if(attuale === 0){

        statoStorico[nome] = 1;

    }

    else if(attuale === 1){

        Object.keys(statoStorico)
        .forEach(n=>{

            if(statoStorico[n] === 2){
                statoStorico[n] = 1;
            }

        });

        statoStorico[nome] = 2;

    }

    else{

        statoStorico[nome] = 0;

    }

    aggiornaStorico();
}

function aggiornaStorico(){

    Object.keys(statoStorico)
    .forEach(nome=>{

        let el =
        document.getElementById(
            "s_" + nome
        );

        if(!el) return;

        el.className = "collega";

        if(statoStorico[nome] === 0)
            el.classList.add("assente");

        if(statoStorico[nome] === 1)
            el.classList.add("presente");

        if(statoStorico[nome] === 2)
            el.classList.add("autista");

    });
}

async function salvaGiornataPassata(){

    let presenti = [];

    let autista = null;

    Object.keys(statoStorico)
    .forEach(nome=>{

        if(statoStorico[nome] > 0)
            presenti.push(nome);

        if(statoStorico[nome] === 2)
            autista = nome;

    });

    if(!autista){

        alert(
            "Seleziona un conducente"
        );

        return;
    }

    await fetch(
        API,
        {
            method:"POST",

            body:JSON.stringify({

                tipo:"salvaTurno",

                data:
                document
                .getElementById("dataStorico")
                .value,

                presenti,

                autista

            })

        }
    );

   alert(
    "Giornata passata salvata"
);

statistiche =
await fetch(
    API + "?action=statistiche"
).then(r=>r.json());

caricaStorico();

document
.getElementById("grigliaStorico")
.innerHTML = "";
}
    
avvia();

</script>

</body>
</html>
