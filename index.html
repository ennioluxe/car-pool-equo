<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Car Pool Equo</title>

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f4f6f9;
    margin:20px;
}

h1{
    text-align:center;
    color:#003366;
}

.card{
    background:white;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.lavoratore{
    border:2px solid #ccc;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.nome{
    font-size:20px;
    font-weight:bold;
}

.punteggio{
    font-size:16px;
    margin-top:5px;
    color:#666;
}

</style>
</head>

<body>

<h1>🚗 Car Pool Equo</h1>

<div class="card">

<h2>Test collegamento Google Sheet</h2>

<p>
Se vedi Mario, Luca, Anna e Paolo,
il collegamento funziona.
</p>

<div id="colleghi" class="grid">

Caricamento...

</div>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbxP2QpM_PjTQfXsBfmgoYZ1W2Ye-hYkUhMD1zAHhbntUdbbo2KsaobMYO_zG-sjHH32-Q/exec";

async function caricaColleghi(){

    try{

        const risposta =
        await fetch(
            API + "?action=colleghi"
        );

        const dati =
        await risposta.json();

        let html = "";

        dati.forEach(c => {

            html += `
            <div class="lavoratore">

                <div class="nome">
                    ${c.nome}
                </div>

                <div class="punteggio">
                    (0)
                </div>

            </div>
            `;

        });

        document.getElementById(
            "colleghi"
        ).innerHTML = html;

    }

    catch(errore){

        document.getElementById(
            "colleghi"
        ).innerHTML =
        "<b>Errore collegamento API</b>";

        console.error(
            errore
        );

    }

}

caricaColleghi();

</script>

</body>
</html>
